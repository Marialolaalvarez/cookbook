<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0; --surface: #ffffff; --ink: #2b2420; --muted: #7a6e66;
    --line: #e8dfd4; --accent: #c2502d; --accent-soft: #f6e3da; --star: #e0a526;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --surface: #262220; --ink: #f2ece6; --muted: #a89d94;
      --line: #3a3430; --accent: #e9774f; --accent-soft: #3d2a22; --star: #f0b93a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(2rem, 5vw, 3rem); margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .controls { max-width: 1100px; margin: 0 auto; padding: 20px 16px; display: flex; flex-wrap: wrap; gap: 10px; }
  input, select { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  input[type=search] { flex: 1 1 240px; }
  .tags { max-width: 1100px; margin: 0 auto; padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .card h2 { font-family: Fraunces, Georgia, serif; font-size: 1.25rem; margin: 6px 0 8px; }
  .cat { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--accent); font-weight: 600; }
  .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .again { display: inline-block; margin-top: 10px; font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
  dialog { border: none; border-radius: 16px; padding: 0; width: min(720px, calc(100% - 32px)); max-height: 88vh; background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 28px; }
  .dlg h2 { font-family: Fraunces, Georgia, serif; font-size: 1.9rem; margin: 4px 0 10px; }
  .dlg h3 { font-family: Fraunces, Georgia, serif; margin: 22px 0 6px; }
  .dlg li { margin: 4px 0; }
  .dlg a { color: var(--accent); }
  .photos { display: grid; gap: 12px; }
  .photos img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .close { float: right; border: none; background: none; font-size: 26px; cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Recetario familiar</h1>
  <p class="sub" id="count"></p>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Buscar receta o ingrediente">
  <select id="cat"><option value="">Todas las categorías</option></select>
  <select id="sort">
    <option value="score">Mejor calificadas</option>
    <option value="time">Más rápidas</option>
    <option value="title">A-Z</option>
    <option value="added">Más recientes</option>
  </select>
</div>
<div class="tags" id="tags"></div>
<main id="grid"></main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="recipes.js"></script>
<script>
const R = window.RECIPES || [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars = n => n ? "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n)) : "sin calificar";
const activeTags = new Set();

[...new Set(R.map(r => r.category).filter(Boolean))].sort()
  .forEach(c => $("cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
[...new Set(R.flatMap(r => r.tags || []))].sort().forEach(t => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = t;
  b.onclick = () => { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); b.classList.toggle("on"); render(); };
  $("tags").append(b);
});

function metaLine(r) {
  return [r.time && `${r.time} min`, r.servings && `para ${r.servings}`, r.difficulty, r.cuisine]
    .filter(Boolean).map(esc).join(" · ");
}

function render() {
  const q = $("q").value.toLowerCase(), cat = $("cat").value, sort = $("sort").value;
  let list = R.filter(r =>
    (!cat || r.category === cat) &&
    [...activeTags].every(t => (r.tags || []).includes(t)) &&
    (!q || (r.title + " " + r.html + " " + (r.tags || []).join(" ")).toLowerCase().includes(q)));
  list.sort((a, b) =>
    sort === "score" ? (b.score || 0) - (a.score || 0) :
    sort === "time" ? (a.time || 999) - (b.time || 999) :
    sort === "added" ? String(b.added).localeCompare(String(a.added)) :
    a.title.localeCompare(b.title));
  $("count").textContent = `${R.length} receta${R.length === 1 ? "" : "s"}`;
  $("grid").innerHTML = list.length ? list.map(r => `
    <button class="card" data-id="${esc(r.id)}">
      <div class="cat">${esc(r.category)}</div>
      <h2>${esc(r.title)}</h2>
      <div class="stars">${stars(r.score)}</div>
      <div class="meta">${metaLine(r)}</div>
      ${["sí", "si", "yes"].includes(String(r.make_again).toLowerCase()) ? '<span class="again">La volvería a hacer</span>' : ""}
    </button>`).join("") : `<p class="empty">${R.length ? "Ninguna receta coincide." : "Aún no hay recetas."}</p>`;
}

$("grid").onclick = e => {
  const card = e.target.closest(".card"); if (!card) return;
  const r = R.find(x => x.id === card.dataset.id);
  $("dlgBody").innerHTML = `
    <button class="close" aria-label="Cerrar" onclick="dlg.close()">×</button>
    <div class="cat">${esc(r.category)}</div>
    <h2>${esc(r.title)}</h2>
    <div class="stars">${stars(r.score)}</div>
    <div class="meta">${metaLine(r)}</div>
    ${r.html}
    ${r.source ? `<p class="meta">Fuente: ${esc(r.source)}</p>` : ""}
    ${(r.photos || []).length ? `<h3>Página original</h3><div class="photos">${r.photos.map(ph =>
      `<a href="photos/${esc(ph)}.jpg" target="_blank" rel="noopener"><img src="photos/${esc(ph)}.jpg" alt="Página del recetario: ${esc(r.title)}" loading="lazy"></a>`).join("")}</div>` : ""}`;
  $("dlg").showModal();
};
$("dlg").onclick = e => { if (e.target.id === "dlg") $("dlg").close(); };
["q", "cat", "sort"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
