<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario familiar</title>
<meta name="description" content="Las recetas de la familia, copiadas del cuaderno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa: #e6007e; --naranja: #ff6b00; --amarillo: #ffb800; --verde: #2fa84f;
    --turquesa: #00a19a; --morado: #7a2e9e; --azul: #1f4fbf; --rojo: #e5243b;
    --bg: #fff4e4; --surface: #ffffff; --ink: #2a1a12; --muted: #7d6a5c; --line: #f0dcc4;
    --shadow: 0 2px 0 rgba(42,26,18,.08), 0 10px 24px rgba(42,26,18,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1026; --surface: #271934; --ink: #fbefe2; --muted: #c2abc9; --line: #3d2a4d;
      --shadow: 0 2px 0 rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; }
  body.locked { overflow: hidden; }
  a { color: inherit; }

  /* ---------- Papel picado ---------- */
  .papel { position: relative; height: 92px; overflow: hidden; }
  .papel::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--ink); opacity: .35; }
  .papel svg { position: absolute; top: 10px; left: 0; height: 82px; width: 100%; }

  /* ---------- Hero ---------- */
  header { max-width: 1140px; margin: 0 auto; padding: 8px 16px 0; text-align: center; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 900; font-size: clamp(2.6rem, 8vw, 5rem); line-height: .95; margin: 18px 0 6px; letter-spacing: -.02em; }
  h1 .a { color: var(--rosa); } h1 .b { color: var(--naranja); }
  .hand { font-family: Caveat, cursive; font-size: clamp(1.4rem, 3.5vw, 1.9rem); color: var(--turquesa); margin: 0; }
  .count { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

  /* ---------- Filters ---------- */
  .cats { max-width: 1140px; margin: 26px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .cat { --c: var(--ink); border: 2px solid var(--c); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 16px; font: 600 14px Inter, sans-serif; cursor: pointer; transition: transform .12s; }
  .cat:hover { transform: translateY(-1px); }
  .cat .n { opacity: .6; font-weight: 500; margin-left: 4px; }
  .cat.on { background: var(--c); color: #fff; }
  .cat.on.dark-text { color: #2a1a12; }
  .tools { max-width: 1140px; margin: 16px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 10px; }
  input, select { font: inherit; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
  input:focus, select:focus { outline: none; border-color: var(--rosa); }
  input[type=search] { flex: 1 1 260px; }
  .tags { max-width: 1140px; margin: 12px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .tag { border: 1px dashed var(--muted); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
  .tag.on { background: var(--turquesa); border: 1px solid var(--turquesa); color: #fff; }

  /* ---------- Lotería cards ---------- */
  main { max-width: 1140px; margin: 0 auto; padding: 28px 16px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; }
  .card { --c: var(--rosa); display: flex; flex-direction: column; text-decoration: none; background: var(--surface); border: 3px solid var(--ink); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 4px 0 var(--c), 0 16px 30px rgba(42,26,18,.16); }
  .frame { position: relative; aspect-ratio: 4 / 3.4; border-radius: 8px; overflow: hidden; background: var(--line); border: 3px solid var(--c); }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
  .num { position: absolute; top: 8px; left: 8px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 900 15px Fraunces, serif; padding: 1px 8px; }
  .label { background: var(--c); color: #fff; margin: 10px -10px 0; padding: 10px 12px; text-align: center; }
  .label.dark-text { color: #2a1a12; }
  .label h2 { margin: 0; font: 900 1.12rem/1.2 Fraunces, Georgia, serif; text-transform: uppercase; letter-spacing: .02em; }
  .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; color: var(--muted); font-size: 13px; padding: 10px 4px 2px; text-align: center; }
  .stars { color: var(--amarillo); letter-spacing: 2px; }
  .unscored { font-family: Caveat, cursive; font-size: 17px; color: var(--muted); }
  .again { font-size: 12px; font-weight: 600; color: var(--verde); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; font-family: Caveat, cursive; font-size: 1.6rem; }

  /* ---------- Recipe sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--bg); }
  .sheet[hidden] { display: none; }
  .sheet-head { --c: var(--rosa); background: var(--c); color: #fff; padding: 0 16px 34px; position: relative; }
  .sheet-head.dark-text { color: #2a1a12; }
  .sheet-head .papel::before { background: currentColor; }
  .sheet-bar { max-width: 980px; margin: 0 auto; display: flex; justify-content: space-between; gap: 8px; }
  .btn { font: 600 14px Inter, sans-serif; border: 2px solid currentColor; color: inherit; background: transparent; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.18); }
  .sheet-title { max-width: 980px; margin: 14px auto 0; }
  .sheet-title .kicker { font: 700 13px Inter, sans-serif; text-transform: uppercase; letter-spacing: .12em; opacity: .85; }
  .sheet-title h2 { font: 900 clamp(2rem, 6vw, 3.4rem)/1.02 Fraunces, Georgia, serif; margin: 6px 0 10px; }
  .sheet-title .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; opacity: .95; }
  .sheet-title .stars, .sheet-title .unscored { color: inherit; opacity: .85; }
  .sheet-body { max-width: 980px; margin: -18px auto 0; padding: 0 16px 80px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
  .panel { background: var(--surface); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow); }
  .panel h3 { font: 900 1.3rem Fraunces, Georgia, serif; margin: 0 0 10px; color: var(--c); }
  .panel h3:not(:first-child) { margin-top: 22px; }
  .ing ul { list-style: none; padding: 0; margin: 0; }
  .ing li { padding: 8px 0 8px 32px; position: relative; border-bottom: 1px dashed var(--line); cursor: pointer; user-select: none; }
  .ing li::before { content: ""; position: absolute; left: 0; top: 10px; width: 18px; height: 18px; border: 2px solid var(--c); border-radius: 6px; }
  .ing li.done { color: var(--muted); text-decoration: line-through; }
  .ing li.done::before { background: var(--c); box-shadow: inset 0 0 0 3px var(--surface); }
  .ing .hint { font-family: Caveat, cursive; color: var(--muted); font-size: 17px; margin: 10px 0 0; }
  .steps ol { list-style: none; counter-reset: s; padding: 0; margin: 0; }
  .steps ol li { counter-increment: s; position: relative; padding: 2px 0 16px 50px; }
  .steps ol li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 900 16px Fraunces, serif; }
  .steps.dark-text ol li::before { color: #2a1a12; }
  .nosteps { font-family: Caveat, cursive; font-size: 1.35rem; color: var(--muted); margin: 0; }
  .notes { background: #fff3a8; color: #3b2f12; border-radius: 4px; padding: 16px 18px; margin-top: 22px; transform: rotate(-.6deg); box-shadow: 0 6px 14px rgba(0,0,0,.12); font-family: Caveat, cursive; font-size: 1.3rem; line-height: 1.35; }
  .notes h3 { display: none; }
  .notes p { margin: 0 0 6px; }
  .src { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .unsure { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--amarillo); color: #2a1a12; font: 700 12px Inter, sans-serif; vertical-align: 2px; cursor: help; }
  .original { grid-column: 1 / -1; }
  .original h3 { font: 900 1.3rem Fraunces, Georgia, serif; color: var(--c); margin: 8px 0 12px; }
  .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .photos img { width: 100%; display: block; border-radius: 12px; border: 3px solid var(--ink); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  footer { text-align: center; color: var(--muted); padding: 0 16px 40px; font-family: Caveat, cursive; font-size: 1.3rem; }

  @media (max-width: 720px) {
    .sheet-body { grid-template-columns: 1fr; }
    main { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
    .label h2 { font-size: .95rem; }
  }
  @media print {
    body > *:not(.sheet) { display: none !important; }
    .sheet { position: static; overflow: visible; }
    .sheet-bar, .papel, .original { display: none; }
    .sheet-head { background: none; color: #000; padding-bottom: 0; }
    .panel { box-shadow: none; padding: 0; }
    .sheet-body { margin-top: 10px; }
  }
</style>
</head>
<body>
<div class="papel" id="papelTop" aria-hidden="true"></div>
<header>
  <h1><span class="a">Recetario</span> <span class="b">familiar</span></h1>
  <p class="hand">Las recetas de la familia, copiadas del cuaderno</p>
  <p class="count" id="count"></p>
</header>

<nav class="cats" id="cats" aria-label="Categorías"></nav>
<div class="tools">
  <input type="search" id="q" placeholder="Buscar receta o ingrediente" aria-label="Buscar">
  <select id="sort" aria-label="Ordenar">
    <option value="title">A-Z</option>
    <option value="score">Mejor calificadas</option>
    <option value="time">Más rápidas</option>
    <option value="added">Más recientes</option>
  </select>
</div>
<div class="tags" id="tags"></div>
<main id="grid"></main>
<footer>hecho con cariño en casa</footer>

<section class="sheet" id="sheet" hidden></section>
<div class="toast" id="toast"></div>

<script src="recipes.js"></script>
<script>
const R = (window.RECIPES || []).slice().sort((a, b) => a.title.localeCompare(b.title, "es"));
R.forEach((r, i) => r.n = i + 1);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unsure = html => html.replaceAll("[?]", '<span class="unsure" title="Lectura dudosa del cuaderno">?</span>');

const PALETTE = ["--rosa", "--naranja", "--amarillo", "--verde", "--turquesa", "--morado", "--azul", "--rojo"];
const CAT_ORDER = ["entradas", "platos fuertes", "pescados y mariscos", "sopas y caldos", "ensaladas", "postres", "bebidas"];
const CAT_COLOR = {
  "entradas": "--amarillo", "platos fuertes": "--naranja", "pescados y mariscos": "--azul",
  "sopas y caldos": "--turquesa", "ensaladas": "--verde", "postres": "--rosa", "bebidas": "--morado",
};
const DARK_TEXT = new Set(["--amarillo"]);
const cats = CAT_ORDER.concat([...new Set(R.map(r => r.category).filter(c => c && !CAT_ORDER.includes(c)))].sort((a, b) => a.localeCompare(b, "es")));
cats.forEach((c, i) => { if (!CAT_COLOR[c]) CAT_COLOR[c] = PALETTE[i % PALETTE.length]; });
const colorOf = r => CAT_COLOR[r.category] || "--rosa";
const darkCls = r => DARK_TEXT.has(colorOf(r)) ? " dark-text" : "";
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";

/* ---------- Papel picado ---------- */
function papelPicado(el, colors, flagW = 74) {
  const id = "cut-" + el.id, w = Math.max(el.clientWidth || innerWidth, 320);
  const n = Math.ceil(w / flagW) + 1, h = 70, fw = flagW - 8;
  const edge = Array.from({ length: 7 }, (_, k) => `${fw - k * fw / 6},${h - (k % 2 ? 0 : 7)}`).join(" ");
  const zz = Array.from({ length: 9 }, (_, k) => `${fw * .15 + k * fw * .7 / 8},${k % 2 ? 40 : 47}`).join(" ");
  const flags = Array.from({ length: n }, (_, i) => {
    const x = i * flagW + 4;
    return `<polygon mask="url(#${id})" transform="translate(${x} 0) rotate(${i % 2 ? 1.2 : -1.2} ${fw / 2} 0)" points="0,0 ${fw},0 ${edge}" fill="${colors[i % colors.length]}"/>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${w} 82" preserveAspectRatio="xMinYMin slice">
    <defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-10" y="-5" width="${fw + 20}" height="${h + 15}">
      <rect x="-10" y="-5" width="${fw + 20}" height="${h + 15}" fill="#fff"/>
      <circle cx="${fw / 2}" cy="24" r="8" fill="#000"/>
      <path d="M${fw / 2} 7 l4 5 -4 5 -4 -5z" fill="#000"/>
      <circle cx="${fw * .2}" cy="24" r="3.5" fill="#000"/><circle cx="${fw * .8}" cy="24" r="3.5" fill="#000"/>
      <polyline points="${zz}" stroke="#000" stroke-width="3.5" fill="none"/>
      <circle cx="${fw / 2}" cy="58" r="3" fill="#000"/>
    </mask></defs>${flags}</svg>`;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const BRIGHT = () => ["--rosa", "--amarillo", "--turquesa", "--naranja", "--verde", "--morado", "--azul", "--rojo"].map(css);
const drawTop = () => papelPicado($("papelTop"), BRIGHT());
drawTop(); addEventListener("resize", drawTop);

/* ---------- Filters ---------- */
let activeCat = "";
const activeTags = new Set();
function drawCats() {
  const all = [{ key: "", label: "Todas", n: R.length, c: "--ink" }]
    .concat(cats.map(c => ({ key: c, label: cap(c), n: R.filter(r => r.category === c).length, c: CAT_COLOR[c] })));
  $("cats").innerHTML = all.map(o => `<button class="cat${o.key === activeCat ? " on" : ""}${DARK_TEXT.has(o.c) ? " dark-text" : ""}" style="--c: var(${o.c})" data-k="${esc(o.key)}">${esc(o.label)}<span class="n">${o.n}</span></button>`).join("");
}
$("cats").onclick = e => { const b = e.target.closest(".cat"); if (!b) return; activeCat = b.dataset.k; drawCats(); render(); };
[...new Set(R.flatMap(r => r.tags || []))].sort((a, b) => a.localeCompare(b, "es")).forEach(t => {
  const b = document.createElement("button");
  b.className = "tag"; b.textContent = t;
  b.onclick = () => { activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); b.classList.toggle("on"); render(); };
  $("tags").append(b);
});

function stars(r) {
  if (!r.score) return '<span class="unscored">sin calificar</span>';
  const s = Math.round(r.score);
  return `<span class="stars" aria-label="${s} de 5">${"★".repeat(s)}${"☆".repeat(5 - s)}</span>`;
}
const isAgain = r => ["sí", "si", "yes"].includes(String(r.make_again || "").toLowerCase());
function facts(r) {
  return [r.time && `${r.time} min`, r.servings && `para ${r.servings}`, r.difficulty, r.cuisine && cap(r.cuisine)].filter(Boolean).map(esc);
}

function render() {
  const q = $("q").value.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, ""), sort = $("sort").value;
  const norm = s => s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "");
  let list = R.filter(r =>
    (!activeCat || r.category === activeCat) &&
    [...activeTags].every(t => (r.tags || []).includes(t)) &&
    (!q || norm(r.title + " " + r.html.replace(/<[^>]+>/g, " ") + " " + (r.tags || []).join(" ")).includes(q)));
  list.sort((a, b) =>
    sort === "score" ? (b.score || 0) - (a.score || 0) || a.n - b.n :
    sort === "time" ? (a.time || 999) - (b.time || 999) || a.n - b.n :
    sort === "added" ? String(b.added).localeCompare(String(a.added)) || a.n - b.n :
    a.n - b.n);
  $("count").textContent = `${R.length} receta${R.length === 1 ? "" : "s"} del cuaderno`;
  $("grid").innerHTML = list.length ? list.map(r => {
    const ph = (r.photos || [])[0];
    return `<a class="card" href="#${esc(r.id)}" style="--c: var(${colorOf(r)})">
      <div class="frame"><span class="num">${r.n}</span>${ph ? `<img src="photos/thumbs/${esc(ph)}.jpg" alt="" loading="lazy">` : ""}</div>
      <div class="label${darkCls(r)}"><h2>${esc(r.title)}</h2></div>
      <div class="meta">${stars(r)}${facts(r).length ? `<span>${facts(r).join(" · ")}</span>` : ""}${isAgain(r) ? '<span class="again">La volvería a hacer</span>' : ""}</div>
    </a>`;
  }).join("") : `<p class="empty">${activeCat && !R.some(r => r.category === activeCat) ? `Aún no hay ${esc(activeCat)} en el recetario` : R.length ? "Ninguna receta coincide" : "Aún no hay recetas"}</p>`;
}
["q", "sort"].forEach(id => $(id).addEventListener("input", render));

/* ---------- Recipe sheet ---------- */
function splitSections(html) {
  const t = document.createElement("template");
  t.innerHTML = unsure(html);
  const out = { ing: [], steps: [], notes: [] };
  let bucket = "ing";
  [...t.content.children].forEach(el => {
    if (el.tagName === "H3") {
      const h = el.textContent.trim().toLowerCase();
      bucket = h.startsWith("procedimiento") ? "steps" : h.startsWith("notas") ? "notes" : "ing";
    }
    out[bucket].push(el.outerHTML);
  });
  return out;
}

function openRecipe(r) {
  const c = colorOf(r), s = splitSections(r.html), dk = darkCls(r);
  $("sheet").innerHTML = `
    <div class="sheet-head${dk}" style="--c: var(${c})">
      <div class="papel" id="papelSheet" aria-hidden="true"></div>
      <div class="sheet-bar">
        <button class="btn" id="back">← Todas las recetas</button>
        <span><button class="btn" id="share">Copiar enlace</button> <button class="btn" id="print">Imprimir</button></span>
      </div>
      <div class="sheet-title">
        <div class="kicker">N.º ${r.n} · ${esc(r.category)}</div>
        <h2>${esc(r.title)}</h2>
        <div class="facts">${stars(r)}${facts(r).map(f => `<span>${f}</span>`).join("")}${isAgain(r) ? "<span>La volvería a hacer</span>" : ""}</div>
      </div>
    </div>
    <div class="sheet-body" style="--c: var(${c})">
      <div class="panel ing">${s.ing.join("")}<p class="hint">toca un ingrediente para tacharlo</p></div>
      <div>
        <div class="panel steps${dk}">${s.steps.join("") || '<h3>Procedimiento</h3><p class="nosteps">El cuaderno no trae procedimiento para esta receta.</p>'}</div>
        ${s.notes.length ? `<div class="notes">${s.notes.join("")}</div>` : ""}
        ${r.source ? `<p class="src">Fuente: ${esc(r.source)}</p>` : ""}
      </div>
      ${(r.photos || []).length ? `<div class="original"><h3>La página del cuaderno</h3><div class="photos">${r.photos.map(ph =>
        `<a href="photos/${esc(ph)}.jpg" target="_blank" rel="noopener"><img src="photos/${esc(ph)}.jpg" alt="Página del cuaderno: ${esc(r.title)}" loading="lazy"></a>`).join("")}</div></div>` : ""}
    </div>`;
  $("sheet").hidden = false; $("sheet").scrollTop = 0;
  document.body.classList.add("locked");
  document.title = `${r.title} · Recetario familiar`;
  const head = getComputedStyle(document.documentElement).getPropertyValue(c).trim();
  const others = BRIGHT().filter(x => x.toLowerCase() !== head.toLowerCase());
  papelPicado($("papelSheet"), DARK_TEXT.has(c) ? others.slice(0, 4) : ["#ffffff", ...others.slice(0, 3)], 64);
  $("back").onclick = () => { history.pushState("", "", location.pathname + location.search); route(); };
  $("print").onclick = () => print();
  $("share").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); toast("Enlace copiado"); }
    catch { toast(location.href); }
  };
  $("sheet").querySelectorAll(".ing li").forEach(li => li.onclick = () => li.classList.toggle("done"));
}
function closeRecipe() {
  $("sheet").hidden = true; $("sheet").innerHTML = "";
  document.body.classList.remove("locked");
  document.title = "Recetario familiar";
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const r = R.find(x => x.id === id);
  r ? openRecipe(r) : closeRecipe();
}
addEventListener("hashchange", route);
addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) $("back").click(); });

drawCats(); render(); route();
</script>
</body>
</html>
